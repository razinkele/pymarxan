name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ tests/

  types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,shiny]"
      # Both layers — matches `make types`. Phase 20 extended mypy
      # coverage to src/pymarxan_shiny/ and the Makefile reflects that;
      # CI must too or the layer drifts type-unsafe between releases.
      - run: mypy src/pymarxan/ src/pymarxan_shiny/ --ignore-missing-imports

  test:
    needs: [lint, types]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[all]"
      # HiGHS binary for PuLP's HiGHS_CMD, so the backend-parametrized tests
      # (Stage 4 tolerance cases) run here instead of skipping. highsbox ships
      # the `highs` executable but does not put it on PATH or the loader path.
      - name: Install HiGHS
        run: |
          pip install highsbox
          python - <<'EOF' >> "$GITHUB_ENV"
          import os, highsbox
          print(f"LD_LIBRARY_PATH={highsbox.highs_lib_dir()}")
          EOF
          python -c "import os, highsbox; print(os.path.dirname(highsbox.highs_bin_path()))" >> "$GITHUB_PATH"
      # Fail loudly if HiGHS is not detected, rather than silently skipping its tests.
      - run: python -c "from pymarxan.solvers._backends import _available_backends as a; assert a()['highs'], a()"
      # `-m "not bench"` skips perf-budget benchmarks (sized for the dev
      # machine; could fail on slower CI runners). Run manually via
      # `make bench` against the canonical environment.
      - run: pytest tests/ -v -m "not bench" --cov --cov-report=term-missing --cov-fail-under=75
